name: CI — الجودة والأمان (مونتاج متعدد الوكلاء)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# أقل صلاحيات لرمز GITHUB_TOKEN (قراءة فقط)؛ الأفعال مثبّتة بـ SHA ضد وسم متحرك مُخترق.
permissions:
  contents: read

jobs:
  python-checks:
    name: Python — فحص + اختبارات
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: src/requirements.lock
      - name: تثبيت الاعتماديات (قفل بـ hashes)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r src/requirements.lock
          pip install pytest
      - name: فحص الصياغة (py_compile)
        run: python -m compileall -q src/
      - name: تشغيل الاختبارات (pytest)
        run: python -m pytest -v
      - name: الاستيراد وتسجيل الوكلاء
        run: |
          python -X utf8 -c "
          import sys; sys.stdout.reconfigure(encoding='utf-8')
          import src.agents
          assert sorted(src.agents.AGENT_REGISTRY) == ['analyst','audio','critic','director','render'], src.agents.AGENT_REGISTRY
          assert sorted(src.agents.validation.STAGE_VALIDATORS) == sorted(src.agents.ceo_agent.STAGE_ORDER), 'مراحل ≠ بوابات'
          print('✓ الوكلاء والبوابات متطابقان')
          "

  ts-checks:
    name: TypeScript — بناء + عقد + MCP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      # FFmpeg حقيقي: اختبارات الوسائط/التصدير/MCP تُتخطّى بدونه (skipped لا passed).
      # bubblewrap: عزل ffmpeg (اختبارات bwrap الفعلية تُتخطّى — skipped لا passed — إن عطّل المشغّل user namespaces).
      - name: تثبيت FFmpeg وbubblewrap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg bubblewrap
      # Python لاختبار جسر الخطط (MCP ↔ مسار الوكلاء) — الحزم الدنيا بلا CrewAI.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: حزم Python الدنيا لمسار الوكلاء
        run: pip install "pydantic>=2.7" "httpx>=0.27" "python-dotenv>=1.0"
      - name: تثبيت الاعتماديات (lockfile مجمّد)
        run: pnpm install --frozen-lockfile
      - name: تدقيق تبعيات الإنتاج (ثغرات high+ تفشل البناء)
        run: pnpm audit --prod --audit-level=high
      - name: فحص TypeScript (tsc)
        run: npx tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: اختبارات الواجهة والمحرّك وMCP (Vitest)
        run: pnpm test
      - name: فحص مطابقة العقد الموحّد (Python ↔ TypeScript)
        run: node scripts/check-contract.ts
      - name: E2E خادم MCP عبر stdio (FFmpeg حقيقي + ffprobe)
        run: pnpm mcp:e2e
      - name: بناء الإنتاج
        run: pnpm build
      - name: E2E الواجهة (Playwright + Chromium + FFmpeg حقيقي)
        run: |
          npx playwright install --with-deps chromium
          pnpm start -p 3000 &
          npx --yes wait-on -t 60000 http://localhost:3000
          pnpm e2e:ui
      # دخان الواجهة (T-16): متصفح حقيقي: رفع → تقسيم → تراجع → إزالة صمت → تصدير → ffprobe.
      - name: تثبيت Chromium لاختبار الواجهة
        run: npx playwright install --with-deps chromium
      - name: دخان الواجهة (Playwright)
        run: |
          PORT=3100 npx next start -p 3100 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100 >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:3100 pnpm ui:smoke

  secrets:
    name: حارس الأسرار (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
